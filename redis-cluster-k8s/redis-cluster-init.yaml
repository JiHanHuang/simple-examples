apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-init
spec:
  ttlSecondsAfterFinished: 30  # 完成后 30 秒自动删除
  template:
    spec:
      restartPolicy: Never  # 失败时退出
      containers:
      - name: cluster-init
        image: redis:7-alpine
        command:
        - /bin/sh
        - -c
        - |
          # 等待所有 Pod 就绪
          echo "Waiting for all pods to be ready..."
          sleep 30
          
          # 解析 Headless Service，获取所有 Pod IP
          # 短名在 Pod 所在 namespace 内自动解析（Job 与 Service 同 namespace 才能工作）
          # 只保留纯 IPv4，排除 DNS Server 行（如 10.43.0.10:53 / 10.43.0.10#53）
          POD_IPS=$(nslookup redis-cluster-service | awk '/^Address/ { if ($2 ~ /^([0-9]{1,3}\.){3}[0-9]{1,3}$/) print $2 }')
          
          # 防御：解析不到节点直接退出，避免拼出空参数
          if [ -z "$POD_IPS" ]; then
            echo "ERROR: no redis pod IPs resolved from service redis-cluster-service" >&2
            exit 1
          fi
          
          # 构建节点列表
          NODES=""
          for IP in $POD_IPS; do
            NODES="${NODES}${IP}:6379 "
          done
          
          # 执行集群创建命令
          redis-cli --cluster create $NODES --cluster-replicas 1 --cluster-yes
          
          # 验证集群状态
          FIRST_NODE=$(echo $POD_IPS | awk '{print $1}')
          redis-cli -h $FIRST_NODE -p 6379 cluster info